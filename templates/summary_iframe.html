<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tabla Resumen</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 2em;
      background-color: #f9f9f9;
    }
    h2 {
      color: #1a237e;
    }
    iframe {
      border: none;
      width: 100%;
      height: 600px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .btn-download {
      display: inline-block;
      margin-top: 10px;
      margin-bottom: 20px;
      padding: 8px 16px;
      background-color: #1565c0;
      color: white;
      text-decoration: none;
      border-radius: 4px;
      font-weight: bold;
    }
    .btn-download:hover {
      background-color: #0d47a1;
    }
    a.back-link {
      display: inline-block;
      margin-top: 20px;
      text-decoration: none;
      color: #1565c0;
      font-weight: bold;
    }
    a.back-link:hover {
      color: #0d47a1;
    }
  </style>
</head>
<body>
  <h2>Tabla Resumen</h2>

  <!-- Download button -->
  <a href="{{ url_for('download_summary') }}" class="btn-download">📥 Descargar como Excel</a>

  <!-- Iframe with summary table -->
  <iframe src="{{ chart }}"></iframe>

  <!-- Back link -->
  <br>
  <a href="/" class="back-link">← Volver al inicio</a>
</body>
</html>
