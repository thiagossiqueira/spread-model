{% extends "shared/base.html" %}

{% block body %}
<div class="container mt-4">

    <div class="d-flex justify-content-end mb-3">
        <form method="get" action="{{ url_for('spread') }}">
            <select name="tipo" onchange="this.form.submit()" class="form-select">
                <option value="di" {% if tipo == 'di' %}selected{% endif %}>DI Spread</option>
                <option value="ipca" {% if tipo == 'ipca' %}selected{% endif %}>IPCA Spread</option>
            </select>
        </form>
    </div>

    <iframe src="{{ chart }}" width="100%" height="800" frameborder="0"></iframe>
</div>
{% endblock %}
