<!-- templates/spread_iframe.html -->
{% extends "shared/base.html" %}

{% block title %}Spreads 3D - {{ tipo | upper }}{% endblock %}

{% block head %}
  <style>
    iframe {
      width: 100%;
      height: 85vh;
      border: none;
    }
  </style>
{% endblock %}

{% block body %}
  <h2>Gráfico 3D: Spread vs {{ "DI" if tipo == "di" else "IPCA" }}</h2>
  <iframe src="/{{ chart }}" title="Gráfico de Spreads {{ tipo | upper }}"></iframe>
{% endblock %}
